[project]
name = "confl"
version = "0.1.0"
description = "An unofficial CLI for Atlassian Confluence Cloud"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0,<1.0.0",
    "rich>=13.0.0,<15.0.0",
    "httpx>=0.27.0,<1.0.0",
    "tomli-w>=1.2.0,<2.0.0",
    "mistune>=3.0.0,<4.0.0",
]

[project.scripts]
confl = "confl.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-httpx>=0.30.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.8.0",
    "markdownify>=0.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/confl"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["confl"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
packages = ["confl"]
mypy_path = "src"

[tool.pytest.ini_options]
addopts = "--cov=confl --cov-report=term-missing --cov-branch"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
